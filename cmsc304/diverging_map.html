<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diverging Map Demo</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;600&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #0d0d0f;
    color: #e8e4dc;
    font-family: 'DM Sans', sans-serif;
    padding: 14px;
  }

  .maps-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .panel { display: flex; flex-direction: column; gap: 6px; }

  svg.map {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }

  .state-path {
    stroke: #0d0d0f;
    stroke-width: 0.5;
    cursor: crosshair;
  }
  .state-path:hover { stroke: #fff; stroke-width: 1.2; }

  canvas.bar {
    width: 100%;
    height: 18px;
    border-radius: 3px;
    display: block;
  }

  .tooltip {
    position: fixed;
    background: #1a1a22;
    border: 1px solid #2e2e3e;
    border-radius: 6px;
    padding: 7px 12px;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    color: #e8e4dc;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.1s;
    z-index: 100;
    white-space: nowrap;
    letter-spacing: 0.05em;
  }
  .tooltip .state-name { font-size: 12px; font-weight: 500; margin-bottom: 2px; }
  .tooltip .state-val  { color: #888; }
</style>
</head>
<body>

<div id="tooltip" class="tooltip">
  <div class="state-name" id="tt-name"></div>
  <div class="state-val"  id="tt-val"></div>
</div>

<div class="maps-row">
  <div class="panel">
    <svg class="map" id="map-div" viewBox="0 0 960 600"></svg>
    <canvas class="bar" id="bar-div" width="480" height="18"></canvas>
  </div>
  <div class="panel">
    <svg class="map" id="map-seq" viewBox="0 0 960 600"></svg>
    <canvas class="bar" id="bar-seq" width="480" height="18"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script>
(function () {

  function diverging(t) {
    function lerp(a,b,s){ return a+(b-a)*s; }
    if (t < 0.5) {
      const s = t/0.5;
      return [lerp(0.13,1,s), lerp(0.31,1,s), lerp(0.66,1,s)];
    } else {
      const s = (t-0.5)/0.5;
      return [lerp(1,0.70,s), lerp(1,0.09,s), lerp(1,0.09,s)];
    }
  }

  const VL=[[.267,.005,.329],[.283,.055,.386],[.278,.104,.431],[.263,.149,.466],[.241,.190,.494],[.215,.228,.513],[.190,.263,.525],[.166,.296,.532],[.143,.328,.536],[.122,.359,.537],[.103,.390,.535],[.087,.420,.530],[.075,.450,.522],[.068,.481,.511],[.072,.511,.496],[.089,.541,.478],[.120,.571,.457],[.164,.600,.433],[.217,.629,.406],[.275,.656,.376],[.337,.682,.344],[.402,.707,.310],[.470,.730,.273],[.541,.752,.235],[.613,.773,.196],[.685,.792,.157],[.758,.811,.118],[.827,.830,.083],[.893,.850,.055],[.949,.873,.052],[.987,.903,.104],[.993,.906,.144]];
  function viridis(t) {
    const n=VL.length-1,i=Math.min(Math.floor(t*n),n-1),f=t*n-i,a=VL[i],b=VL[Math.min(i+1,n)];
    return [a[0]+f*(b[0]-a[0]),a[1]+f*(b[1]-a[1]),a[2]+f*(b[2]-a[2])];
  }

  function toCSS(rgb){ return `rgb(${rgb[0]*255|0},${rgb[1]*255|0},${rgb[2]*255|0})`; }

  function renderBar(id, fn) {
    const c = document.getElementById(id), ctx = c.getContext('2d'), W = c.width;
    for (let x=0;x<W;x++){
      ctx.fillStyle = toCSS(fn(x/(W-1)));
      ctx.fillRect(x,0,1,c.height);
    }
  }

  renderBar('bar-div', diverging);
  renderBar('bar-seq', viridis);

  // Maine (23) = 0.50, California (06) = 0.50 — sit right at the white midpoint
  const fipsData = {
    "01":0.72,"02":0.14,"04":0.61,"05":0.55,"06":0.50,"08":0.67,"09":0.84,
    "10":0.79,"11":0.74,"12":0.65,"13":0.58,"15":0.40,"16":0.33,"17":0.76,
    "18":0.62,"19":0.44,"20":0.38,"21":0.53,"22":0.59,"23":0.50,"24":0.81,
    "25":0.86,"26":0.69,"27":0.71,"28":0.45,"29":0.47,"30":0.24,"31":0.31,
    "32":0.57,"33":0.82,"34":0.87,"35":0.48,"36":0.89,"37":0.66,"38":0.18,
    "39":0.73,"40":0.54,"41":0.64,"42":0.83,"44":0.85,"45":0.60,"46":0.22,
    "47":0.63,"48":0.92,"49":0.42,"50":0.78,"51":0.80,"53":0.75,"54":0.36,
    "55":0.68,"56":0.20
  };

  const fipsNames = {
    "01":"Alabama","02":"Alaska","04":"Arizona","05":"Arkansas","06":"California",
    "08":"Colorado","09":"Connecticut","10":"Delaware","11":"D.C.","12":"Florida",
    "13":"Georgia","15":"Hawaii","16":"Idaho","17":"Illinois","18":"Indiana",
    "19":"Iowa","20":"Kansas","21":"Kentucky","22":"Louisiana","23":"Maine",
    "24":"Maryland","25":"Massachusetts","26":"Michigan","27":"Minnesota",
    "28":"Mississippi","29":"Missouri","30":"Montana","31":"Nebraska","32":"Nevada",
    "33":"New Hampshire","34":"New Jersey","35":"New Mexico","36":"New York",
    "37":"North Carolina","38":"North Dakota","39":"Ohio","40":"Oklahoma",
    "41":"Oregon","42":"Pennsylvania","44":"Rhode Island","45":"South Carolina",
    "46":"South Dakota","47":"Tennessee","48":"Texas","49":"Utah","50":"Vermont",
    "51":"Virginia","53":"Washington","54":"West Virginia","55":"Wisconsin","56":"Wyoming"
  };

  const tooltip = document.getElementById('tooltip');
  const ttName  = document.getElementById('tt-name');
  const ttVal   = document.getElementById('tt-val');

  fetch('https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json')
    .then(r => r.json())
    .then(us => {
      const states     = topojson.feature(us, us.objects.states);
      const projection = d3.geoAlbersUsa().scale(1300).translate([487, 305]);
      const path       = d3.geoPath().projection(projection);

      ['div','seq'].forEach(type => {
        const fn = type === 'div' ? diverging : viridis;
        d3.select(`#map-${type}`)
          .selectAll('path')
          .data(states.features)
          .enter().append('path')
          .attr('class', 'state-path')
          .attr('d', path)
          .attr('fill', d => toCSS(fn(fipsData[d.id] ?? 0.5)))
          .on('mousemove', function(event, d) {
            ttName.textContent    = fipsNames[d.id] ?? 'Unknown';
            ttVal.textContent     = `value: ${Math.round((fipsData[d.id] ?? 0.5) * 100)}`;
            tooltip.style.opacity = '1';
            tooltip.style.left    = (event.clientX + 14) + 'px';
            tooltip.style.top     = (event.clientY - 36) + 'px';
          })
          .on('mouseleave', () => tooltip.style.opacity = '0');
      });
    });

})();
</script>
</body>
</html>
